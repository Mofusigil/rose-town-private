  <script>
    var parser = new UAParser();
    window.roseUAParser = parser;
    console.log("roseUAParser OSInfo:", parser.getOS(), "roseUAParser BrowserInfo:", parser.getBrowser());
    function getQueryVariable(variable) {
      var query = window.location.search.substring(1);
      var vars = query.split("&");
      for (var i = 0; i < vars.length; i++) {
        var pair = vars[i].split("=");
        if (pair[0] == variable) { return pair[1]; }
      }
      return (false);
    }
    function getActName() {
      return getQueryVariable("act");
    }

    function getJumpParam() {
      return getQueryVariable("jumpParam");
    } 
  </script>

<body>
  <div id="GameDiv" style="border:0; box-shadow: none">
    <canvas id="GameCanvas"> </canvas>
    <div id="splash">
      <img id="bgImg" />
      <div class="progress-bar stripes">
        <span style="width: 0%"></span>
      </div>
    </div>
  </div>

  <script type="text/javascript">
    //isH5 == 1,isFlash == 0
    var isH5 = 0;
    var d_w = isH5 ? 1100 : 910;
    var d_h = isH5 ? 660 : 588;
    var gameDiv = document.getElementById("GameDiv");
    gameDiv.style.width = d_w + "px";
    gameDiv.style.height = d_h + "px";
    var gameCanvas = document.getElementById("GameCanvas");
    gameCanvas.width = d_w;
    gameCanvas.height = d_h;
    var imgSrc = isH5 ? "https://baobaocdn.qq.com/cdn/h5/meigui/img/mark_bg.jpg" : "https://baobaocdn.qq.com/cdn/h5/meigui/img/mark_bg_1.jpg";
    jQuery('#bgImg').attr("src", imgSrc);
  </script>

  <script src="//baobaocdn.qq.com/cdn/h5/meigui/lib/PetCall.js" charset="utf-8"></script>
  <script src="https://baobao.qq.com/act/gamepet/pet_config.js?v=20251210" charset="gb2312"></script>
  <script type="text/javascript" src="//baobaocdn.qq.com/cdn/h5/meigui/lib/base64.js"></script>
  <script src="src/settings.2dbf4.js" charset="utf-8"></script>
  <script src="main.77704.js" charset="utf-8"></script>

  <script type="text/javascript">
    (function () {
      // open web debugger console
      if (typeof VConsole !== 'undefined') {
        window.vConsole = new VConsole();
      }

      var debug = window._CCSettings.debug;
      var splash = document.getElementById('splash');
      splash.style.display = 'block';

      function loadScript(moduleName, cb) {
        function scriptLoaded() {
          document.body.removeChild(domScript);
          domScript.removeEventListener('load', scriptLoaded, false);
          cb && cb();
        };
        var domScript = document.createElement('script');
        domScript.async = true;
        domScript.src = moduleName;
        domScript.addEventListener('load', scriptLoaded, false);
        document.body.appendChild(domScript);
      }

      loadScript(debug ? 'cocos2d-js.js' : '//baobaocdn.qq.com/cdn/h5/meigui/lib/cocos2d-js-min.js', function () {
        if (CC_PHYSICS_BUILTIN || CC_PHYSICS_CANNON) {
          loadScript(debug ? 'physics.js' : 'physics-min.js', window.boot);
        }
        else {
          window.boot();
        }
      });

      window.addEventListener('message', function (event) {
        if (event.data.action == "closeh5Music") {
          window.closeH5Music && window.closeH5Music();
          console.log("closeh5Music");
        }
        else if (event.data.action == "stopSendLoginTimeReward") {
          window.stopSendLoginTimeReward && window.stopSendLoginTimeReward();
          console.log("stopSendLoginTimeReward");
        }
        else if (event.data.action == "jumpToH5Game") {
          console.log("jumpToH5Game_index", event.data.param);
          localStorage.setItem("jumpToH5GameParam", JSON.stringify(event.data.param));
        }
        else if (event.data.action == "openActivity") {
          console.log("openActivity", event.data.npcName);
          window.Rose.ActivityEntrance && window.Rose.ActivityEntrance.openActivity && window.Rose.ActivityEntrance.openActivity(event.data.npcName + "_npc");
        }
      }, false);


    })();


  </script>

</body>
